[package]
name = "savant-elite"
version = "0.2.0"
edition = "2021"
description = "Windows-first cross-platform Rust CLI for the Kinesis Savant Elite / X-keys USB foot pedal"
license-file = "LICENSE"
repository = "https://github.com/SamLeatherdale/savant-elite"
homepage = "https://github.com/SamLeatherdale/savant-elite"
readme = "README.md"
keywords = ["kinesis", "foot-pedal", "usb", "hid", "windows"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
hidapi = "2"
rusb = "0.9"
libusb1-sys = { version = "0.7", features = ["vendored"] }
anyhow = "1"
hex = "0.4"
rich_rust = "0.2.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[lib]
name = "savant_elite"
path = "src/lib.rs"

[[bin]]
name = "savant"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Graphics_Gdi"] }
