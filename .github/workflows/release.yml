# Publishes a Windows GitHub Release (ZIP + SHA-256).
# Run from Actions "Run workflow", or by pushing an annotated v* tag.
# Does not run on every push to main. Never sends USB writes.
name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag (e.g. v0.4.0). Created at this run's commit if it does
          not already exist on the remote.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Publish Windows GitHub Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release

      - name: Verify CLI without hardware
        run: |
          .\target\release\savant.exe --version
          .\target\release\savant.exe --help

      - name: Package ZIP and SHA-256
        shell: pwsh
        run: |
          $pkg = "target\manual-release"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Force target\release\savant.exe, README.md, LICENSE $pkg\
          $zipName = "savant-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Force `
            -Path $pkg\savant.exe, $pkg\README.md, $pkg\LICENSE `
            -DestinationPath (Join-Path $pkg $zipName)
          $zip = Get-Item (Join-Path $pkg $zipName)
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $pkg "$zipName.sha256"), "$hash  $zipName`n")

      - uses: actions/upload-artifact@v4
        with:
          name: savant-x86_64-pc-windows-msvc
          path: |
            target/manual-release/savant-x86_64-pc-windows-msvc.zip
            target/manual-release/savant-x86_64-pc-windows-msvc.zip.sha256
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: "1"
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v') {
            throw "Release tag must start with 'v' (got '$tag')."
          }

          $pkg = "target\manual-release"
          $zip = Join-Path $pkg "savant-x86_64-pc-windows-msvc.zip"
          $sha = Join-Path $pkg "savant-x86_64-pc-windows-msvc.zip.sha256"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $sha)) {
            throw "Expected ZIP and SHA-256 files are missing."
          }

          $PSNativeCommandUseErrorActionPreference = $false

          function Upload-Assets {
            gh release upload $tag $zip $sha --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for $tag"
            }
          }

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Upload-Assets
          } else {
            $createArgs = @(
              $tag,
              $zip,
              $sha,
              "--title", $tag,
              "--generate-notes",
              "--target", $env:GITHUB_SHA
            )
            if ($env:RELEASE_PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) {
              Upload-Assets
            }
          }
